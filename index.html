<body><div class="app"><header class="top"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><span><strong>ಕನ್ನಡ ಪದ ಗುರುತಿಸುವಿಕೆ</strong><small>KANNADA WORD RECOGNITION</small></span></div><div class="topright"><span id="modePill" class="pill">DEMO PREVIEW</span><button id="exitBtn" class="quiet hidden">ನಿಲ್ಲಿಸಿ</button></div></header><main id="main" class="main"></main><footer class="footer"><span>ಪದ ಗುರುತಿಸುವಿಕೆ · ಸಂಶೋಧನಾ ಪೂರ್ವವೀಕ್ಷಣೆ</span><span>ಪ್ರಸ್ತುತ ಆವೃತ್ತಿ ಭಾಗವಹಿಸುವವರ ನೈಜ ಡೇಟಾ ಸಂಗ್ರಹಣೆಗೆ ಅನುಮೋದಿತವಲ್ಲ</span></footer></div>
<script>
const PRACTICE=[['ಮನೆ','real'],['ನುಕ','nonword'],['ಮರ','real'],['ತೊಮ','nonword'],['ನೀರು','real']].map((x,i)=>({id:'P'+(i+1),stimulus:x[0],type:x[1]}));

const $=s=>document.querySelector(s),main=$('#main');
const S={screen:'launch',mode:'demo',code:'DEMO-001',session:1,bank:[],practice:0,index:0,items:[],records:[],started:0,startedAt:'',runId:'',feedback:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const visit=()=>Math.ceil(S.session/2);
function shell(html,exit=false){main.innerHTML=html;$('#exitBtn').classList.toggle('hidden',!exit);$('#modePill').textContent=S.mode==='research'?'RESEARCH PREVIEW':'DEMO PREVIEW';$('#modePill').classList.toggle('research',S.mode==='research');}
function launch(){S.screen='launch';const status=S.bankStatus==='valid'?'<div class="validate">✓ 540 ಪದಗಳು ಪರಿಶೀಲಿಸಲಾಗಿದೆ · ಪ್ರತಿ ಸೆಷನ್ 45 ನಿಜವಾದ + 45 ಕಲ್ಪಿತ</div>':S.bankStatus==='invalid'?'<div class="validate bad">'+S.bankErrors.map(esc).join('<br>')+'</div>':'<div class="note">ಸಂಶೋಧನಾ ಪೂರ್ವವೀಕ್ಷಣೆಗೆ ಅನುಮೋದಿತ 540 ಪದಗಳ CSV ಅಪ್‌ಲೋಡ್ ಅಗತ್ಯ.</div>';
shell('<section class="grid"><div class="intro"><div class="eyebrow">READING RESEARCH · KANNADA</div><h1>ಇದು ನಿಜವಾದ ಪದವೇ ಅಥವಾ <em>ಕಲ್ಪಿತ ಪದವೇ?</em></h1><p class="lead">ಮಗುವಿಗೆ ಪರದೆಯ ಮೇಲೆ ಒಂದೊಂದು ಕನ್ನಡ ಪದ ತೋರಿಸಲಾಗುತ್ತದೆ. ಆ ಪದ ನಿಜವಾದ ಪದವೇ ಅಥವಾ ಕಲ್ಪಿತ ಪದವೇ ಎಂದು ಗುರುತಿಸಲು ಹೇಳಲಾಗುತ್ತದೆ.</p><div class="facts"><div class="fact"><b>01</b><span><strong>ಸರಳ ಸೂಚನೆಗಳು</strong><small>ಮಗು ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ ಸರಳ ಕ್ರಮ</small></span></div><div class="fact"><b>02</b><span><strong>ಎರಡು ಉತ್ತರಗಳು</strong><small>ನಿಜವಾದ ಪದ ಅಥವಾ ಕಲ್ಪಿತ ಪದ</small></span></div><div class="fact"><b>03</b><span><strong>ಆರು ಸೆಷನ್‌ಗಳು</strong><small>ಪ್ರತಿ ಸೆಷನ್‌ನ ಪ್ರಗತಿ ಪ್ರತ್ಯೇಕವಾಗಿ</small></span></div></div></div><aside class="card"><div class="kicker">SESSION SETUP</div><h2>ಪರೀಕ್ಷೆಯನ್ನು ಪ್ರಾರಂಭಿಸಿ</h2><p class="sub">ಭಾಗವಹಿಸುವವರ ಕೋಡ್ ಮತ್ತು ಸೆಷನ್ ಆಯ್ಕೆಮಾಡಿ.</p><label class="label" for="code">ಭಾಗವಹಿಸುವವರ ಕೋಡ್</label><input id="code" class="input" maxlength="40" value="'+esc(S.code)+'" placeholder="ಉದಾ. KWR-001"><label class="label" for="session">ಪರೀಕ್ಷಾ ಸೆಷನ್</label><select id="session" class="input">'+Array.from({length:6},(_,i)=>'<option value="'+(i+1)+'" '+(S.session===i+1?'selected':'')+'>ಸೆಷನ್ '+(i+1)+' · ಭೇಟಿ '+Math.ceil((i+1)/2)+'</option>').join('')+'</select><div class="visit"><span class="dot"></span>ಆಯ್ಕೆಮಾಡಿದ ಸೆಷನ್ · ಭೇಟಿ '+visit()+' / 3</div><div class="divider"></div><div class="modes"><button class="mode '+(S.mode==='demo'?'on':'')+'" id="demoMode">ಡೆಮೊ ಪೂರ್ವವೀಕ್ಷಣೆ</button><button class="mode '+(S.mode==='research'?'on':'')+'" id="researchMode">ಸಂಶೋಧನಾ ಪೂರ್ವವೀಕ್ಷಣೆ</button></div>'+(S.mode==='demo'?'<div class="note"><b>ಡೆಮೊ ಮೋಡ್</b><br>5 ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆಗಳು + 18 ಪ್ರದರ್ಶನ ಪ್ರಶ್ನೆಗಳು. ಈ ಪದಗಳು ಮಾನ್ಯಗೊಳಿಸಿದ ಸಂಶೋಧನಾ ಪದಗಳಲ್ಲ.</div><button class="btn primary full" id="startDemo">ಡೆಮೊ ಪ್ರಾರಂಭಿಸಿ →</button>':'<label class="label" for="bankFile">ಅನುಮೋದಿತ ಪದಗಳ CSV ಫೈಲ್</label><input id="bankFile" class="input" type="file" accept=".csv,text/csv">'+status+'<button class="btn secondary full" id="template">CSV ಮಾದರಿ ಡೌನ್‌ಲೋಡ್ ↓</button><button class="btn primary full" id="startResearch" '+(S.bankStatus==='valid'?'':'disabled')+'>ಸೆಷನ್ ಪ್ರಿವ್ಯೂ ಪ್ರಾರಂಭಿಸಿ →</button><p class="micro">ಇದು ಪೂರ್ವವೀಕ್ಷಣೆ ಮಾತ್ರ. ಸುರಕ್ಷಿತ ಸರ್ವರ್ ಮತ್ತು ಸಂಶೋಧನಾ ಅನುಮೋದನೆ ಸಿದ್ಧವಾಗುವವರೆಗೆ ನೈಜ ಮಕ್ಕಳ ಡೇಟಾ ಬಳಸಬೇಡಿ.</p>')+'</aside></section><section class="protocol"><div><b>540</b><span>ಒಟ್ಟು ಅಂಕಿತ ಪದಗಳು</span></div><div><b>6</b><span>ಪರೀಕ್ಷಾ ಸೆಷನ್‌ಗಳು</span></div><div><b>45 + 45</b><span>ನಿಜವಾದ + ಕಲ್ಪಿತ</span></div><div><b>5</b><span>ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆಗಳು</span></div></section><p class="notice">ಸೂಚನೆ: ಪ್ರಸ್ತುತ ಡೆಮೊ ಪದಗಳನ್ನು ಮಾತ್ರ ಬಳಸಿ. ಅಧಿಕೃತ ಕನ್ನಡ ಪದಪಟ್ಟಿ ಮತ್ತು ಸುರಕ್ಷಿತ ಸಂಶೋಧನಾ ಡೇಟಾ ಸಂಗ್ರಹಣೆ ಇನ್ನೂ ಜೋಡಿಸಬೇಕಿದೆ.</p>');
$('#demoMode').onclick=()=>{S.mode='demo';launch()};$('#researchMode').onclick=()=>{S.mode='research';launch()};$('#session').onchange=e=>{S.session=+e.target.value;S.visit=visit()};$('#code').oninput=e=>S.code=e.target.value;
$('#startDemo')?.addEventListener('click',()=>start('demo'));$('#bankFile')?.addEventListener('change',e=>loadBank(e.target.files[0]));$('#startResearch')?.addEventListener('click',()=>{if(S.bankStatus==='valid'&&confirm('ಇದು ಸಂಶೋಧನಾ ಪೂರ್ವವೀಕ್ಷಣೆ ಮಾತ್ರ. ಉತ್ತರಗಳು ಈ ಬ್ರೌಸರ್‌ನಲ್ಲೇ ಉಳಿಯುತ್ತವೆ. ಮುಂದುವರಿಯಬೇಕೇ?'))start('research')});$('#template')?.addEventListener('click',downloadTemplate);
}
function start(mode){S.code=($('#code')?.value||S.code).trim();S.session=+($('#session')?.value||S.session);if(!S.code)return alert('ಭಾಗವಹಿಸುವವರ ಕೋಡ್ ನಮೂದಿಸಿ.');S.mode=mode;S.practice=0;S.index=0;S.records=[];S.runId=Date.now()+'-'+Math.random().toString(36).slice(2,7);S.items=mode==='demo'?DEMO:S.bank.filter(x=>x.session===S.session).sort((a,b)=>a.position-b.position);instructions()}
function instructions(){S.screen='instructions';shell('<section class="wrap"><div class="eyebrow">'+(S.mode==='demo'?'DEMO PREVIEW':'RESEARCH SESSION PREVIEW')+'</div><div class="panel"><div class="kicker">ಸೆಷನ್ '+S.session+' / 6</div><h1>ಇದು ನಿಜವಾದ ಪದವೇ?</h1><p>ಪರದೆಯ ಮೇಲೆ ಒಂದು ಪದ ಕಾಣಿಸುತ್ತದೆ. ಅದು ನಿಜವಾದ ಕನ್ನಡ ಪದವಾಗಿದ್ದರೆ ಬಲಭಾಗದ ಬಟನ್ ಒತ್ತಿ. ಅದು ನಿಜವಾದ ಪದವಲ್ಲದಿದ್ದರೆ ಎಡಭಾಗದ ಬಟನ್ ಒತ್ತಿ.</p><div class="guide"><div><span class="key">←</span><span><strong>ಕಲ್ಪಿತ ಪದ</strong><small>ಇದು ನಿಜವಾದ ಪದವಲ್ಲ</small></span></div><div><span class="key">→</span><span><strong>ನಿಜವಾದ ಪದ</strong><small>ಇದು ಕನ್ನಡದಲ್ಲಿ ಇರುವ ಪದ</small></span></div></div><div class="warning">ಸಾಧ್ಯವಾದಷ್ಟು ಗಮನದಿಂದ ಉತ್ತರಿಸಿ. ವೇಗಕ್ಕಿಂತ ಸರಿಯಾದ ಆಯ್ಕೆಗೆ ಆದ್ಯತೆ ನೀಡಿ.</div><button class="btn primary" id="practiceStart" style="margin-top:23px">ಅಭ್ಯಾಸ ಪ್ರಾರಂಭಿಸಿ →</button></div><div class="meta"><span>ಭಾಗವಹಿಸುವವರು <b>'+esc(S.code)+'</b></span><span>ಭೇಟಿ <b>'+visit()+'/3</b></span><span>ಸೆಷನ್ <b>'+S.session+'/6</b></span></div></section>');$('#practiceStart').onclick=()=>practice()}
function clock(){S.started=performance.now();S.startedAt=new Date().toISOString()}
function trial(practice){S.screen=practice?'practice':'test';const list=practice?PRACTICE:S.items,idx=practice?S.practice:S.index,item=list[idx],n=idx+1,total=list.length,pct=Math.round(idx/total*100);shell('<section class="test"><div class="testline"><span>'+(practice?'ಅಭ್ಯಾಸ':'ಸೆಷನ್ '+S.session+' · ಭೇಟಿ '+visit())+'</span><span class="counter">'+(practice?'ಅಭ್ಯಾಸ ':'ಪ್ರಶ್ನೆ ')+n+' / '+total+'</span></div><div class="bar"><span style="width:'+pct+'%"></span></div><div class="stimulus"><span class="overline">'+(practice?'ಅಭ್ಯಾಸ ಪದ':'ಪದ ಗುರುತಿಸುವಿಕೆ')+'</span><div class="word" lang="kn">'+esc(item.stimulus)+'</div><span class="instruction">ಈ ಪದವನ್ನು ಗುರುತಿಸಿ</span></div><div class="prompt">ನಿಮ್ಮ ಉತ್ತರವನ್ನು ಆಯ್ಕೆಮಾಡಿ</div><div class="answers"><button class="answer" data-answer="nonword"><span class="key">←</span><span><strong>ಕಲ್ಪಿತ ಪದ</strong><small>ನಿಜವಾದ ಪದವಲ್ಲ</small></span></button><button class="answer" data-answer="real"><span class="key">→</span><span><strong>ನಿಜವಾದ ಪದ</strong><small>ಕನ್ನಡದಲ್ಲಿ ಇರುವ ಪದ</small></span></button></div><div class="hint"><kbd>←</kbd> ಕಲ್ಪಿತ ಪದ　·　<kbd>→</kbd> ನಿಜವಾದ ಪದ</div></section>',true);clock();document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>respond(b.dataset.answer))}
function practice(){trial(true)}
function respond(answer){if(!['practice','test'].includes(S.screen))return;const p=S.screen==='practice',item=p?PRACTICE[S.practice]:S.items[S.index],now=new Date(),correct=answer===item.type;S.records.push({participant_code:S.code,visit:visit(),session:S.session,phase:p?'practice':'test',trial_number:p?S.practice+1:S.index+1,item_id:item.id,stimulus:item.stimulus,item_type:item.type,response:answer,correct,reaction_time_ms:Math.max(0,Math.round(performance.now()-S.started)),trial_started_at:S.startedAt,response_recorded_at:now.toISOString()});if(p){S.feedback={correct,answer,expected:item.type};practiceFeedback();return}S.index++;save();if(S.index>=S.items.length)complete();else if(S.index%15===0)breakScreen();else trial(false)}
function practiceFeedback(){S.screen='practice-feedback';const f=S.feedback;shell('<section class="milestone"><div class="seal">'+(f.correct?'✓':'↻')+'</div><div class="eyebrow" style="justify-content:center">ಅಭ್ಯಾಸ ಪ್ರತಿಕ್ರಿಯೆ</div><h1>'+(f.correct?'ಬಹಳ ಚೆನ್ನಾಗಿದೆ!':'ಮತ್ತೊಮ್ಮೆ ಗಮನಿಸಿ')+'</h1><p>ನೀವು ಆಯ್ಕೆಮಾಡಿದ್ದು: <b>'+(f.answer==='real'?'ನಿಜವಾದ ಪದ':'ಕಲ್ಪಿತ ಪದ')+'</b><br>ಸರಿಯಾದ ಆಯ್ಕೆ: <b>'+(f.expected==='real'?'ನಿಜವಾದ ಪದ':'ಕಲ್ಪಿತ ಪದ')+'</b></p><button class="btn primary" id="nextPractice">ಮುಂದುವರಿಸಿ →</button></section>',true);$('#nextPractice').onclick=nextPractice}
function nextPractice(){S.practice++;if(S.practice>=PRACTICE.length)practiceDone();else practice()}
function practiceDone(){S.screen='practice-done';shell('<section class="milestone"><div class="seal">✓</div><div class="eyebrow" style="justify-content:center">ಅಭ್ಯಾಸ ಪೂರ್ಣ</div><h1>ಮುಖ್ಯ ಪರೀಕ್ಷೆಗೆ ಸಿದ್ಧರಾಗಿ</h1><p>ಅಭ್ಯಾಸ ಮುಗಿದಿದೆ. ಈಗ ಮುಖ್ಯ ಸೆಷನ್ ಪ್ರಾರಂಭವಾಗುತ್ತದೆ.</p><div class="stats"><div><b>05</b><small>ಅಭ್ಯಾಸ ಪ್ರಶ್ನೆಗಳು</small></div><div><b>'+S.items.length+'</b><small>ಸೆಷನ್ ಪ್ರಶ್ನೆಗಳು</small></div></div><button class="btn primary" id="begin">ಮುಖ್ಯ ಪರೀಕ್ಷೆ ಪ್ರಾರಂಭಿಸಿ →</button></section>',true);$('#begin').onclick=countdown}
function countdown(){S.screen='countdown';let n=3;const tick=()=>{shell('<section class="countdown"><div class="eyebrow" style="justify-content:center">ಸಿದ್ಧರಾಗಿ</div><h1 style="font-size:32px">ಪರೀಕ್ಷೆ ಪ್ರಾರಂಭವಾಗಲಿದೆ</h1><div class="count">'+n+'</div><p>ಪರದೆಯ ಮೇಲೆ ಕಾಣಿಸುವ ಪದದ ಮೇಲೆ ಗಮನ ಹರಿಸಿ.</p></section>');if(n===0)setTimeout(()=>trial(false),500);else{n--;setTimeout(tick,800)}};tick()}
function breakScreen(){S.screen='break';shell('<section class="milestone"><div class="break-art"><i></i><i></i><i></i></div><div class="eyebrow" style="justify-content:center">ಚಿಕ್ಕ ವಿರಾಮ</div><h1>ಚೆನ್ನಾಗಿ ಮಾಡುತ್ತಿದ್ದೀರಿ!</h1><p>ಸ್ವಲ್ಪ ವಿರಾಮ ತೆಗೆದುಕೊಳ್ಳಿ. ಸಿದ್ಧರಾದಾಗ ಮುಂದುವರಿಯಿರಿ.</p><div class="bar"><span style="width:'+Math.round(S.index/S.items.length*100)+'%"></span></div><p>'+S.index+' / '+S.items.length+' ಪ್ರಶ್ನೆಗಳು ಪೂರ್ಣ</p><button class="btn primary" id="continue">ಮುಂದುವರಿಸಿ →</button></section>',true);$('#continue').onclick=()=>trial(false)}
function complete(){S.screen='complete';save();shell('<section class="milestone"><div class="seal">✓</div><div class="eyebrow" style="justify-content:center">ಸೆಷನ್ ಪೂರ್ಣ</div><h1>ಧನ್ಯವಾದಗಳು!</h1><p>ಈ ಸೆಷನ್ ಪೂರ್ಣಗೊಂಡಿದೆ. ಪೂರ್ವವೀಕ್ಷಣೆಯ ಉತ್ತರಗಳನ್ನು ಈ ಸಾಧನದಲ್ಲಿ ಉಳಿಸಲಾಗಿದೆ.</p><div class="summary"><div><small>ಭಾಗವಹಿಸುವವರ ಕೋಡ್</small><strong>'+esc(S.code)+'</strong></div><div><small>ಭೇಟಿ / ಸೆಷನ್</small><strong>'+visit()+' / '+S.session+'</strong></div><div><small>ಪರೀಕ್ಷಾ ಪ್ರತಿಕ್ರಿಯೆಗಳು</small><strong>'+S.records.filter(x=>x.phase==='test').length+'</strong></div></div><div class="actions"><button class="btn primary" id="download">ಫಲಿತಾಂಶ ಡೌನ್‌ಲೋಡ್ ↓</button><button class="btn secondary" id="home">ಮುಖ್ಯ ಪುಟ</button></div><p class="micro">ಇದು ಸಂಶೋಧನಾ ಡೇಟಾಬೇಸ್ ಅಲ್ಲ. ಫಲಿತಾಂಶಗಳು ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಮಾತ್ರ ಉಳಿಯುತ್ತವೆ.</p></section>');$('#download').onclick=downloadResults;$('#home').onclick=launch}
function save(){try{let old=JSON.parse(localStorage.getItem('kn-word-preview:v1')||'[]');old=old.filter(x=>x.run_id!==S.runId);old.push({run_id:S.runId,participant_code:S.code,visit:visit(),session:S.session,mode:S.mode,created_at:new Date().toISOString(),research_ready:false,records:S.records});localStorage.setItem('kn-word-preview:v1',JSON.stringify(old))}catch(e){console.warn(e)}}
const COLS=['participant_code','visit','session','phase','trial_number','item_id','stimulus','item_type','response','correct','reaction_time_ms','trial_started_at','response_recorded_at'];function csv(rows){const q=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};return [COLS.join(','),...rows.map(r=>COLS.map(c=>q(r[c])).join(','))].join('\n')}
function downloadResults(){const blob=new Blob(['\ufeff'+csv(S.records)],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=S.code.replace(/[^a-z0-9_-]/gi,'_')+'-visit-'+visit()+'-session-'+S.session+'-preview.csv';a.click();URL.revokeObjectURL(url)}
function downloadTemplate(){const content='session,item_id,stimulus,item_type,position\n';const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kannada-word-bank-template.csv';a.click();URL.revokeObjectURL(url)}
function parseCsv(text){const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw Error('CSVಯಲ್ಲಿ ಪದಗಳ ಸಾಲುಗಳಿಲ್ಲ.');const split=line=>{let a=[],s='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){s+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(s.trim());s=''}else s+=c}a.push(s.trim());return a};const h=split(lines[0]).map(x=>x.toLowerCase()),required=['session','item_id','stimulus','item_type','position'];const miss=required.filter(x=>!h.includes(x));if(miss.length)throw Error('ಕಾಣೆಯಾದ columns: '+miss.join(', '));return lines.slice(1).map((line,i)=>{const c=split(line),r=Object.fromEntries(h.map((x,j)=>[x,c[j]||''])),t=r.item_type.toLowerCase().replace(/[ -]/g,'_');return{session:+r.session,id:r.item_id,stimulus:r.stimulus,type:t==='real_word'?'real':t==='non_word'?'nonword':t,position:+r.position,row:i+2}})}
function validate(items){let errors=[],ids=new Set();if(items.length!==540)errors.push('ಒಟ್ಟು 540 ಪದಗಳು ಬೇಕು; ಈಗ '+items.length+' ಇವೆ.');for(const x of items){if(!Number.isInteger(x.session)||x.session<1||x.session>6)errors.push('ಸಾಲು '+x.row+': session 1–6 ಆಗಿರಬೇಕು.');if(!x.id)errors.push('ಸಾಲು '+x.row+': item_id ಖಾಲಿ.');if(ids.has(x.id))errors.push('ಮರುಕಳಿಸಿದ item_id: '+x.id);ids.add(x.id);if(!x.stimulus)errors.push('ಸಾಲು '+x.row+': stimulus ಖಾಲಿ.');if(!['real','nonword'].includes(x.type))errors.push('ಸಾಲು '+x.row+': item_type real ಅಥವಾ nonword ಆಗಿರಬೇಕು.');if(!Number.isInteger(x.position)||x.position<1||x.position>90)errors.push('ಸಾಲು '+x.row+': position 1–90 ಆಗಿರಬೇಕು.')}for(let s=1;s<=6;s++){let a=items.filter(x=>x.session===s),r=a.filter(x=>x.type==='real').length,n=a.filter(x=>x.type==='nonword').length,p=new Set(a.map(x=>x.position));if(a.length!==90)errors.push('ಸೆಷನ್ '+s+': 90 ಪದಗಳು ಬೇಕು; '+a.length+' ಇವೆ.');if(r!==45)errors.push('ಸೆಷನ್ '+s+': 45 ನಿಜವಾದ ಪದಗಳು ಬೇಕು; '+r+' ಇವೆ.');if(n!==45)errors.push('ಸೆಷನ್ '+s+': 45 ಕಲ್ಪಿತ ಪದಗಳು ಬೇಕು; '+n+' ಇವೆ.');if(p.size!==a.length)errors.push('ಸೆಷನ್ '+s+': position ಮರುಕಳಿಸಿದೆ.')}return errors}
async function loadBank(file){if(!file)return;try{S.bank=parseCsv(await file.text());S.bankErrors=validate(S.bank);S.bankStatus=S.bankErrors.length?'invalid':'valid'}catch(e){S.bank=[];S.bankErrors=[e.message];S.bankStatus='invalid'}launch()}
$('#exitBtn').onclick=()=>{if(confirm('ಈ ಪೂರ್ವವೀಕ್ಷಣೆಯನ್ನು ನಿಲ್ಲಿಸಿ ಮುಖ್ಯ ಪುಟಕ್ಕೆ ಮರಳಬೇಕೇ?'))launch()};window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&['practice','test'].includes(S.screen)){e.preventDefault();respond('nonword')}if(e.key==='ArrowRight'&&['practice','test'].includes(S.screen)){e.preventDefault();respond('real')}if(e.key==='Enter'&&S.screen==='practice-feedback')nextPractice();if(e.key==='Enter'&&S.screen==='practice-done')countdown();if(e.key==='Enter'&&S.screen==='break')trial(false)});
launch();
</script></body></html>
